services:
  postgres:
    image: postgres:16-alpine
    container_name: support-ticket-postgres
    environment:
      POSTGRES_DB: support_ticket_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_ticket_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    container_name: support-ticket-api
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/support_ticket_demo?schema=public
      JWT_SECRET: docker-local-secret-change-before-production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: >
      sh -c "npm install &&
      npx prisma generate &&
      npx prisma db push &&
      npm run seed &&
      npm run dev -w apps/api"

  web:
    image: node:22-alpine
    container_name: support-ticket-web
    working_dir: /app
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/apps/web/.next
    command: sh -c "npm install && npm run dev -w apps/web"

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
  web_next:
